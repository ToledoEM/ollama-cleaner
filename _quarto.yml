project:
  type: website
  output-dir: _site
  render:
    - index.qmd

site-url: "https://toledoem.github.io/Delete_ollamahistory_chat/"

website:
  favicon: "https://toledoem.github.io/www/favicon.ico"
  navbar:
    background: primary
    title: "Ollama Chat History Cleaner"
    logo: "img/DOC_logo.svg"
    left:
      - text: "Docs"
        href: index.qmd
    right:
      - icon: github
        href: "https://github.com/ToledoEM/Delete_ollamahistory_chat"
        aria-label: "GitHub repository"
  page-footer:
    left: "MIT License · [ToledoEM](https://github.com/ToledoEM)"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: flatly
    css: styles.css
    toc: true
    toc-location: left
    toc-depth: 3
    toc-expand: 2
    smooth-scroll: true
    anchor-sections: true
    code-copy: true
    include-in-header:
      text: |
        <script data-goatcounter="https://etoledo.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
