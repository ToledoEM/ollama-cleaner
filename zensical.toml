[project]
site_name = "Ollama Chat History Cleaner"
site_url = "https://toledoem.github.io/ollama-cleaner/"
site_author = "ToledoEM"
copyright = "MIT License · <a href=\"https://github.com/ToledoEM\">ToledoEM</a>"

repo_url = "https://github.com/ToledoEM/ollama-cleaner"
repo_name = "ToledoEM/ollama-cleaner"

nav = [
  { "Docs" = "index.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
custom_dir = "overrides"
favicon = "https://toledoem.github.io/www/favicon.ico"
logo = "img/DOC_logo.svg"
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
